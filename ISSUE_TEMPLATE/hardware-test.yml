name: Hardware test result
description: Report a test on a board (decode, CEC, HDR, thermal, streaming resolution).
labels: [hardware-test]
body:
  - type: input
    id: board
    attributes: { label: Board }
    validations: { required: true }
  - type: dropdown
    id: test
    attributes:
      label: Test
      options: [4K HEVC/VP9/AV1 decode, Decode inside Chrome, HDR10 metadata, CEC, Sustained thermal, Power draw, Streaming service resolution, Other]
    validations: { required: true }
  - type: textarea
    id: method
    attributes: { label: Method, description: Kernel, image, commands, content used. }
  - type: textarea
    id: result
    attributes: { label: Result, description: Numbers where possible (dropped frames, temperature, resolution from HDMI capture). }
    validations: { required: true }
